<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     @keyframes nome {
        10%{
            transform:scale(0.1);
        }
           20%{
            transform:scale(0.3);
        
        }
    }
    div{

        animation:nome 2s ease-in-out;
        font-size: 100%;
        box-shadow:  0 10px 12px rgba(0,0,0,0.2);
        height: 300px;
        width: 600px;
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap: 12px;
        background-color: white;
        border-radius: 16px;
        margin-top: 25vh;
        padding: 5px;
        margin: 10px;
    }
    img{
         height: 300px;
        width: 300px;
    }
     form{
         height:300px;
        width: 600px;
        justify-content: center;
        align-items: center;
        
    }
    body{
        display: flex;
    background-color:grey;
    border-radius: 12px;
      animation:nome1 2s ease-in-out;

    }
    @keyframes nome1{
        10%{
          background: black;
        }
           20%{
           background: red;
        }
         30%{
         background: blue;
        }
           40%{
         background-color: orange;
        }50%{
            background-color: blueviolet;

        }
           100%{
            background-color: green;
    }
}
    input{
        padding: 5px;
        
        margin: 10px;
            border:none;
            outline: none;
      
        
    }
  
    button{
          padding: 5px;
        margin-top: 10px;
            width: 215px;
                background-image: linear-gradient(130deg,blue,#1cbce8);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer
            ;
            font-weight: 600;
            transition: all 0.2s ease;
            animation: nome1 ease-in-out;
    }
    a{
        text-decoration: none;
        align-self: center;
        text-align: center;
        justify-content: center;
        align-items: center;
        float: center;
        color: blue;
    }
  
      
     
   
    h2{
        font-weight: 600;
        color: blue;
    }
   
</style>
<body>

       <div>
        <img src="ango13.jpg" alt="">
        <form action="" method="post">
            <h2>FAÇA O SEU LOGIN</h2>  
            <input type="text" placeholder="digite  o seu email" name="usuario">
            <br><br>
            <input type="password" placeholder="digite  a sua palavra-passe" name="senha">
            <br><br>
            <button type="submit">  <a href="#">Enviar</a></button>


            
            <br><br>
            <a href="#">Criar conta</a>
        </form>
    
    </div>

</body>
</html>
